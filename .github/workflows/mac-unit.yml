name: mac-unit
# Design §8.5: Mac candidate. Lock/allowlist consistency; the status check
# reports pin state instead of encoding "unpinned" as the success condition —
# a future pin (P0-E) must be able to pass CI, not break it.

on:
  push:
    branches: [main]
    paths: ['adapters/macos/**', '.github/workflows/mac-unit.yml']
  pull_request:
    paths: ['adapters/macos/**', '.github/workflows/mac-unit.yml']

jobs:
  consistency:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Report lock pin state and check allowlist consistency
        run: |
          status=$(node -e "console.log(JSON.parse(require('fs').readFileSync('adapters/macos/ghost-os/upstream.lock','utf8')).status)")
          echo "ghost-os upstream.lock status: $status"
          if [ "$status" = "pinned" ]; then
            echo "::notice::helper pinned — P0-E decision recorded; Swift package build/test must be added to this job"
          elif [ "$status" != "unpinned" ]; then
            echo "::error::unknown lock status '$status'" >&2
            exit 1
          fi
          node -e "
            const allow = JSON.parse(require('fs').readFileSync('./adapters/macos/ghost-os/tool-allowlist.json','utf8'));
            const overlap = allow.allow.filter((t) => allow.deny.includes(t));
            if (overlap.length) { console.error('allow/deny overlap', overlap); process.exit(1); }
            if (allow.policy !== 'deny-by-default') { console.error('bad policy'); process.exit(1); }
            console.log('macOS scaffolds consistent');
          "
