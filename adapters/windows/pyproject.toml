[project]
name = "aifetchly-windows"
version = "0.1.0"
description = "AiFetchly Computer Use Windows backend integration package (extensions, normalization, reviewed tool surface)"
requires-python = ">=3.14"
# The pinned Windows-MCP revision is added here ONLY when the Phase 0 spike
# (P0-C) records it in upstream.lock. A floating upstream dependency is never
# allowed (design §1.2: "fetching main at build time is forbidden").
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifetchly_windows"]

[tool.hatch.build.targets.wheel.force-include]
"tool-allowlist.json" = "src/aifetchly_windows/data/tool-allowlist.json"
"upstream.lock" = "src/aifetchly_windows/data/upstream.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
