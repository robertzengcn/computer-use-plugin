[project]
name = "aifetchly-grounding"
version = "0.1.0"
description = "Grounding model engineering: reference runner wiring, ONNX export/sharding, manifest assembly and parity cores (developer/CI only, never shipped)"
requires-python = ">=3.14"
# The pinned model engineering stack (torch, transformers, onnx...) is added
# when the P0-D spike records it. It is NEVER part of the Windows backend
# environment (design §1.2: two independent Python environments).
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "jsonschema>=4.23", "rfc3339-validator>=0.1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifetchly_grounding"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
